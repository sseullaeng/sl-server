services:
  mysql:
    image: mysql:8.0
    container_name: sseulang-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: sseulang
      MYSQL_USER: sseulang
      MYSQL_PASSWORD: sseulangpw
      TZ: Asia/Seoul
    ports: ["3307:3306"]
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-time-zone=+09:00"
      - "--ngram_token_size=2"
    volumes:
      - "mysql-data:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpw"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sseulang-redis
    restart: unless-stopped
    ports: ["6380:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - "redis-data:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: sseulang-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: sseulang
      MONGO_INITDB_ROOT_PASSWORD: sseulangpw
      MONGO_INITDB_DATABASE: sseulang
      TZ: Asia/Seoul
    ports: ["27017:27017"]
    volumes:
      - "mongo-data:/data/db"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  mongo-data:
