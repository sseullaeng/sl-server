spring:
  datasource:
    url: jdbc:mysql://localhost:3307/sseulang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: sseulang
    password: sseulangpw
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6380
    mongodb:
      uri: mongodb://sseulang:sseulangpw@localhost:27017/sseulang?authSource=admin

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-please-override-with-64-char-random-string-1234567890}
    access-token-validity-seconds: 1800
    refresh-token-validity-seconds: 604800
  cookie:
    domain: localhost
    secure: false
    same-site: Lax
  oauth2:
    kakao:
      client-id: ${KAKAO_REST_API_KEY:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  aws:
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET:sseulang-bucket}
      presigned-url-expire-seconds: 300
  toss:
    client-key: ${TOSS_CLIENT_KEY:}
    secret-key: ${TOSS_SECRET_KEY:}
    base-url: https://api.tosspayments.com
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
  # 로컬 smoke test 전용 인증 우회 — DevAuthController. prod 배포 시 절대 true 금지.
  dev-auth:
    enabled: true
